# テストの自動実行。push と手動実行で tests/test_filer.py と tests/test_slideshow.py を回す。
#
# test_filer.py は自分で QT_QPA_PLATFORM=offscreen を設定するので、画面のない
# ランナーでもそのまま動く(手元のPCで走らせているのと同じ条件)。
# 他のテストファイルは重い任意依存(rembg等)や実機前提のものがあるので、
# まずはファイラと、それと読み込みを共通にしているスライドショーだけを対象にする。
#
# 失敗時の内容は tests/test_filer.py 自身が ::error 注釈で run ページに出す
# (GITHUB_ACTIONS のときだけ)。以前ここにあった Issue 自動起票ステップは、
# テスト全合格でもジョブが失敗扱いになる不具合があったため廃止した。
name: test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  filer:
    runs-on: windows-latest
    timeout-minutes: 30
    # windows-latest の標準出力/標準エラーは cp1252 なので、テストが日本語を print した
    # 時点で UnicodeEncodeError になり、traceback の表示ごと落ちる(10/27 以降の全滅の原因)。
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存を入れる
        run: pip install -r requirements.txt

      - name: ファイラのテスト
        # 既定の pwsh だと、テストが全部通って python が 0 で終わっても、ステップが
        # exit code 1 で失敗扱いになっていた(10/27 から続いていた。手元で同じ条件に
        # すると python の終了コードは 0)。cmd なら python の終了コードがそのまま
        # ステップの結果になる。
        shell: cmd
        run: python tests/test_filer.py

      - name: スライドショーのテスト
        # ファイラと同じく offscreen で、自分で終了コードを返す(cmd で回す理由も同じ)。
        shell: cmd
        run: python tests/test_slideshow.py
