    <rect x="38" y="378" width="180" height="3" fill="#eeeeee"/>
    <rect x="38" y="378" width="112" height="3" fill="#111111"/>
    <text x="38" y="424" font-size="13" fill="#888888">郵便受け</text>
    <text x="110" y="425" font-size="16" fill="#111111">未ack 0件</text>
    <text x="38" y="478" font-size="12" fill="#aaaaaa">15:12 ack mb-…-02（0.8秒）／ 14:58 push 自動承認 5.5秒</text>
  </g>
  <!-- ============ RIGHT: ALERT ============ -->
  <g>
    <rect x="460" y="14" width="426" height="492" fill="none" stroke="#e4e4e4"/>
    <text x="484" y="52" font-size="12" letter-spacing="3" fill="#999999">異常</text>
