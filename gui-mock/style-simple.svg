<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- ============ LEFT: NORMAL ============ -->
  <g>
    <rect x="14" y="14" width="426" height="492" fill="none" stroke="#e4e4e4"/>
