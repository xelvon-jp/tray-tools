    <text x="484" y="204" font-size="16" fill="#111111"><tspan font-weight="bold">Muse</tspan><tspan>　承認待ち</tspan></text>
    <text x="862" y="204" font-size="13" fill="#888888" text-anchor="end">経過 00:38</text>
    <text x="484" y="240" font-size="13" fill="#c0392b">↓　流れ：停止（カード未表示）</text>
    <text x="484" y="282" font-size="16" fill="#111111"><tspan font-weight="bold">Claude</tspan><tspan>　監視中・カード表示 なし</tspan></text>
    <text x="862" y="282" font-size="13" fill="#888888" text-anchor="end">生存確認 5秒前</text>
    <line x1="484" y1="322" x2="862" y2="322" stroke="#eeeeee"/>
