<title>かずブロック けんきゅうじょ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; overflow: hidden; position: fixed; width: 100%;
    touch-action: manipulation; overscroll-behavior: none;
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    background: #fff7e6; color: #333; user-select: none; -webkit-user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  /* top bar */
  #topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px; background: #ffe9b8; border-bottom: 3px solid #f5c542;
  }
  #title { font-size: 26px; font-weight: bold; color: #8a5a00; }
  .spacer { flex: 1; }
  .bigbtn {
    font-size: 22px; font-weight: bold; border: none; border-radius: 14px;
    padding: 12px 18px; min-height: 56px; min-width: 56px; cursor: pointer;
    background: #ffffff; color: #555; box-shadow: 0 2px 0 rgba(0,0,0,.15);
    touch-action: manipulation;
  }
  .bigbtn:active { transform: translateY(2px); box-shadow: none; }
  .bigbtn:disabled { opacity: .4; }
  #clearbtn { background: #ffd9d9; color: #a33; }

  /* challenge bar (centered, big ghost) */
  #challengebar {
    display: flex; align-items: center; justify-content: center; gap: 18px;
    padding: 10px 16px; background: #eaf6ff; border-bottom: 3px solid #9fd3f5;
    min-height: 96px;
  }
  #challengetext { font-size: 34px; font-weight: bold; color: #1463a3; }
  #challengesub { font-size: 22px; font-weight: bold; color: #5b8db8; margin-top: 4px; }
  #ghost { display: grid; gap: 3px; opacity: .45; }
  #ghost .gcell { width: 20px; height: 20px; border-radius: 4px; background: #7fb8dd; }
  #donemsg { font-size: 38px; font-weight: bold; color: #e67e22; display: none; }

  /* recipe review */
  #review { display: none; align-items: center; gap: 12px; }
  #recipe { display: flex; align-items: center; gap: 10px; }
  #recipe .op { font-size: 34px; font-weight: bold; color: #1463a3; }
  #recipe .result { font-size: 44px; font-weight: bold; color: #e67e22; margin-left: 2px; }
  .mini { position: relative; }
  .mini .cells { display: grid; gap: 2px; }
  .mini .cell { border-radius: 5px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.35); }
  .mini .num {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-weight: bold; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.35); pointer-events: none;
  }
  #nextbtn { background: #c8f2c8; color: #27632a; display: none; }

  /* play stage */
  #stage { position: relative; flex: 1; touch-action: none; overflow: hidden; }

  .block { position: absolute; cursor: grab; touch-action: none; }
  .block .cells { display: grid; gap: 3px; }
  .block .cell { width: 48px; height: 48px; border-radius: 10px; box-shadow: inset 0 -5px 0 rgba(0,0,0,.18), inset 0 4px 0 rgba(255,255,255,.35); }
  .block .num {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 56px; font-weight: bold; color: #fff;
    text-shadow: 0 2px 0 rgba(0,0,0,.35), 0 0 8px rgba(0,0,0,.25); pointer-events: none;
  }
  .block.pop { animation: pop .25s ease-out; }
  @keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .block.wiggle { animation: wiggle .3s ease-in-out; }
  @keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-2.5deg); } 75% { transform: rotate(2.5deg); } }

  /* parts box */
  #partsbox {
    display: flex; align-items: center; gap: 8px; justify-content: center;
    padding: 10px 12px; background: #ffe9b8; border-top: 3px solid #f5c542;
  }
  #partslabel { font-size: 20px; font-weight: bold; color: #8a5a00; margin-right: 2px; }
  .partbtn {
    width: 68px; height: 68px; border: none; border-radius: 14px; cursor: pointer;
    font-size: 32px; font-weight: bold; color: #fff;
    text-shadow: 0 2px 0 rgba(0,0,0,.3); box-shadow: 0 3px 0 rgba(0,0,0,.2);
    touch-action: manipulation;
  }
  .partbtn:active { transform: translateY(3px); box-shadow: none; }

  /* celebration stars */
  .star {
    position: absolute; font-size: 44px; pointer-events: none; z-index: 50;
    animation: starfly 1.6s ease-out forwards;
  }
  @keyframes starfly {
    0% { transform: translateY(0) scale(.5) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-280px) scale(1.3) rotate(160deg); opacity: 0; }
  }

  /* portrait: shrink and wrap the parts box so it always fits on screen */
  @media (orientation: portrait) {
    #partsbox { flex-wrap: wrap; }
    .partbtn { width: 56px; height: 56px; font-size: 26px; }
    #title { font-size: 21px; }
    #challengetext { font-size: 27px; }
    #challengesub { font-size: 18px; }
    .bigbtn { font-size: 19px; padding: 10px 12px; }
    #undolong { display: none; }
  }

<div id="app">
  <div id="topbar">
    <div id="title">かずブロック けんきゅうじょ</div>

<script>
"use strict";
// ---------- basics ----------
const stage = document.getElementById("stage");
const challengeBar = document.getElementById("challengebar");
const ghostEl = document.getElementById("ghost");
const challengeInfo = document.getElementById("challengeinfo");
const challengeText = document.getElementById("challengetext");
const challengeSub = document.getElementById("challengesub");
const doneMsg = document.getElementById("donemsg");
const reviewEl = document.getElementById("review");
const recipeEl = document.getElementById("recipe");
const nextBtn = document.getElementById("nextbtn");
const undoBtn = document.getElementById("undobtn");

const COLORS = {
  1: "#e74c3c", 2: "#e67e22", 3: "#f2b705", 4: "#2ecc71", 5: "#1abc9c",
  6: "#3498db", 7: "#9b59b6", 8: "#fd79a8", 9: "#8d6e63", 10: "#546e7a"
};
function colorOf(n) { return COLORS[((n - 1) % 10) + 1]; }

// columns for a block of total n: hand table for 1..10; above that pick the
// width (2..7) that leaves the fewest empty cells, then the fewest rows,
// so fused blocks read as a tidy near-rectangle (e.g. 11 -> rows of 6 + 5)
function colsFor(n) {
  const table = { 1: 1, 2: 2, 3: 3, 4: 2, 5: 3, 6: 3, 7: 4, 8: 4, 9: 3, 10: 5 };
  if (table[n]) return table[n];
  let best = 2, bestEmpty = Infinity, bestRows = Infinity;
  for (let cols = 2; cols <= 7; cols++) {
    const rows = Math.ceil(n / cols);
    const empty = rows * cols - n;
    if (empty < bestEmpty || (empty === bestEmpty && rows < bestRows)) {
      best = cols; bestEmpty = empty; bestRows = rows;
    }
  }
  return best;
}

// ---------- sound (WebAudio, quiet, mutable) ----------
let audioCtx = null, masterGain = null, muted = false;
function ensureAudio() {
  if (audioCtx) { if (audioCtx.state === "suspended") audioCtx.resume(); return; }
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.12;
    masterGain.connect(audioCtx.destination);
  } catch (e) { audioCtx = null; }
}
function tone(freq, startIn, dur) {
  if (!audioCtx || muted) return;
  const t0 = audioCtx.currentTime + startIn;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = "sine"; osc.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(1, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(masterGain);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}
const sndPop = () => tone(520, 0, 0.12);
const sndFuse = () => { tone(523, 0, 0.14); tone(784, 0.07, 0.2); };
const sndSplit = () => { tone(784, 0, 0.12); tone(523, 0.07, 0.18); };
const sndDone = () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.11, 0.25)); };

// ---------- block model ----------
// block = { id, leaf: value|null, left, right, x, y, el }
let nextId = 1;
const blocks = new Map();

function makeLeaf(value) { return { id: nextId++, leaf: value, left: null, right: null, x: 0, y: 0, el: null }; }
function makeFused(a, b) { return { id: nextId++, leaf: null, left: a, right: b, x: 0, y: 0, el: null }; }
function totalOf(b) { return b.leaf !== null ? b.leaf : totalOf(b.left) + totalOf(b.right); }
function leavesOf(b, out) {
  out = out || [];
  if (b.leaf !== null) { out.push(b.leaf); return out; }
  leavesOf(b.left, out); leavesOf(b.right, out); return out;
}

const CELL = 48, GAP = 3;
function blockSize(n, cell, gap) {
  cell = cell || CELL; gap = gap === undefined ? GAP : gap;
  const cols = colsFor(n), rows = Math.ceil(n / cols);
  return { cols, rows, w: cols * cell + (cols - 1) * gap, h: rows * cell + (rows - 1) * gap };
}

// build the visual (cells + number) for a block at any cell size
function buildBlockEl(b, cell, gap) {
  const n = totalOf(b);
  const size = blockSize(n, cell, gap);
  const el = document.createElement("div");
  el.style.width = size.w + "px"; el.style.height = size.h + "px";
  const cells = document.createElement("div");
  cells.className = "cells";
  cells.style.display = "grid";
  cells.style.gap = gap + "px";
  cells.style.gridTemplateColumns = "repeat(" + size.cols + ", " + cell + "px)";
  for (const leaf of leavesOf(b)) {
    for (let i = 0; i < leaf; i++) {
      const c = document.createElement("div");
      c.className = "cell";
      c.style.width = cell + "px"; c.style.height = cell + "px";
      c.style.background = colorOf(leaf);
      cells.appendChild(c);
    }
  }
  const num = document.createElement("div");
  num.className = "num";
  num.textContent = n;
  num.style.fontSize = Math.round(cell * 1.16) + "px";
  el.appendChild(cells); el.appendChild(num);
  return el;
}

function renderBlock(b) {
  const el = buildBlockEl(b, CELL, GAP);
  el.className = "block";
  el.style.left = b.x + "px"; el.style.top = b.y + "px";
  el.dataset.id = b.id;
  b.el = el;
  stage.appendChild(el);
  attachPointer(b);
  return el;
}

function removeBlock(b) {
  if (b.el) b.el.remove();
  blocks.delete(b.id);
}
function placeBlock(b, x, y) {
  const size = blockSize(totalOf(b));
  const maxX = Math.max(0, stage.clientWidth - size.w);
  const maxY = Math.max(0, stage.clientHeight - size.h);
  b.x = Math.min(Math.max(0, x), maxX);
  b.y = Math.min(Math.max(0, y), maxY);
  if (b.el) { b.el.style.left = b.x + "px"; b.el.style.top = b.y + "px"; }
}

// ---------- undo (snapshots of the whole forest, max 20) ----------
const history = [];
function serializeBlock(b) {
  if (b.leaf !== null) return { v: b.leaf, x: Math.round(b.x), y: Math.round(b.y) };
  return { a: serializeBlock(b.left), b: serializeBlock(b.right), x: Math.round(b.x), y: Math.round(b.y) };
}
function deserializeBlock(s) {
  let b;
  if (s.v !== undefined) b = makeLeaf(s.v);
  else b = makeFused(deserializeBlock(s.a), deserializeBlock(s.b));
  b.x = s.x; b.y = s.y;
  return b;
}
function snapshot() {
  history.push(Array.from(blocks.values(), serializeBlock));
  if (history.length > 20) history.shift();
  syncUndoBtn();
}
function syncUndoBtn() { undoBtn.disabled = history.length === 0; }
undoBtn.addEventListener("click", () => {
  ensureAudio();
  if (drag || history.length === 0) return;
  const snap = history.pop();
  for (const b of Array.from(blocks.values())) removeBlock(b);
  for (const s of snap) {
    const b = deserializeBlock(s);
    blocks.set(b.id, b);
    renderBlock(b);
    placeBlock(b, b.x, b.y);
  }
  syncUndoBtn();
  updateChallengeInfo();
  sndSplit();
});

// find a spawn spot that does not overlap existing blocks:
// random tries first, then a coarse grid scan, then a cascade fallback
function overlapsAny(x, y, w, h, pad) {
  for (const o of blocks.values()) {
    const s = blockSize(totalOf(o));
    if (!(x + w + pad < o.x || o.x + s.w + pad < x || y + h + pad < o.y || o.y + s.h + pad < y)) return true;
  }
  return false;
}
function findSpawnPos(w, h) {
  const maxX = Math.max(0, stage.clientWidth - w);
  const maxY = Math.max(0, stage.clientHeight - h);
  for (let i = 0; i < 40; i++) {
    const x = Math.random() * maxX;
    const y = Math.random() * Math.min(maxY, 220);
    if (!overlapsAny(x, y, w, h, 10)) return { x, y };
  }
  for (let y = 8; y <= maxY; y += 26) {
    for (let x = 8; x <= maxX; x += 26) {
      if (!overlapsAny(x, y, w, h, 10)) return { x, y };
    }
  }
  const k = blocks.size;
  return { x: (30 + k * 37) % Math.max(1, maxX), y: (20 + k * 53) % Math.max(1, maxY) };
}

// ---------- drag / long-press split / drop to fuse ----------
let drag = null;
function attachPointer(b) {
  b.el.addEventListener("pointerdown", (ev) => {
    ensureAudio();
    ev.preventDefault();
    const rect = b.el.getBoundingClientRect();
    drag = {
      block: b, dx: ev.clientX - rect.left, dy: ev.clientY - rect.top,
      startX: ev.clientX, startY: ev.clientY, moved: false, splitDone: false,
      timer: setTimeout(() => trySplit(drag), 600)
    };
    b.el.setPointerCapture(ev.pointerId);
    b.el.style.zIndex = 10;
  });
  b.el.addEventListener("pointermove", (ev) => {
    if (!drag || drag.block !== b || drag.splitDone) return;
    const srect = stage.getBoundingClientRect();
    if (Math.abs(ev.clientX - drag.startX) > 12 || Math.abs(ev.clientY - drag.startY) > 12) {
      drag.moved = true;
      clearTimeout(drag.timer);
    }
    placeBlock(b, ev.clientX - srect.left - drag.dx, ev.clientY - srect.top - drag.dy);
  });
  const finish = (ev) => {
    if (!drag || drag.block !== b) return;
    clearTimeout(drag.timer);
    const wasSplit = drag.splitDone;
    drag = null;
    b.el.style.zIndex = "";
    if (!wasSplit) tryFuse(b);
  };
  b.el.addEventListener("pointerup", finish);
  b.el.addEventListener("pointercancel", finish);
}

function trySplit(d) {
  if (!d || d.moved || d.splitDone) return;
  const b = d.block;
  if (b.leaf !== null) { // a base part cannot split; just wiggle
    b.el.classList.remove("wiggle"); void b.el.offsetWidth; b.el.classList.add("wiggle");
    return;
  }
  d.splitDone = true;
  snapshot();
  const a = b.left, c = b.right;
  const sizeA = blockSize(totalOf(a)), sizeC = blockSize(totalOf(c));
  const x = b.x, y = b.y;
  removeBlock(b);
  blocks.set(a.id, a); blocks.set(c.id, c);
  renderBlock(a); renderBlock(c);
  placeBlock(a, x - sizeA.w / 2 - 6, y);
  placeBlock(c, x + sizeC.w / 2 + 6, y);
  a.el.classList.add("pop"); c.el.classList.add("pop");
  sndSplit();
  updateChallengeInfo();
  // the dragged element is gone now, so the coming pointerup lands elsewhere
  // and this drag would never finish; close it here
  if (drag === d) drag = null;
}

function rectsNear(b1, b2, pad) {
  const s1 = blockSize(totalOf(b1)), s2 = blockSize(totalOf(b2));
  return !(b1.x + s1.w + pad < b2.x || b2.x + s2.w + pad < b1.x ||
           b1.y + s1.h + pad < b2.y || b2.y + s2.h + pad < b1.y);
}

function tryFuse(b) {
  let best = null, bestDist = Infinity;
  for (const other of blocks.values()) {
    if (other === b) continue;
    if (!rectsNear(b, other, 26)) continue;
    const dx = (b.x - other.x), dy = (b.y - other.y);
    const d = dx * dx + dy * dy;
    if (d < bestDist) { bestDist = d; best = other; }
  }
  if (!best) { updateChallengeInfo(); return; }
  snapshot();
  const merged = makeFused(b, best);
  const nx = Math.round((b.x + best.x) / 2), ny = Math.round((b.y + best.y) / 2);
  removeBlock(b); removeBlock(best);
  blocks.set(merged.id, merged);
  renderBlock(merged);
  placeBlock(merged, nx, ny);
  merged.el.classList.add("pop");
  sndFuse();
  updateChallengeInfo();
  checkChallenge();
}

// ---------- parts box ----------
const partsBox = document.getElementById("partsbox");
for (let n = 1; n <= 10; n++) {
  const btn = document.createElement("button");
  btn.className = "partbtn";
  btn.textContent = n;
  btn.style.background = colorOf(n);
  btn.addEventListener("click", () => {
    ensureAudio();
    snapshot();
    const b = makeLeaf(n);
    blocks.set(b.id, b);
    renderBlock(b);
    const size = blockSize(n);
    const pos = findSpawnPos(size.w, size.h);
    placeBlock(b, pos.x, pos.y);
    b.el.classList.add("pop");
    sndPop();
    updateChallengeInfo();
    checkChallenge();
  });
  partsBox.appendChild(btn);
}

// ---------- challenge (grows gradually: cap 12 -> 30, +3 per 3 completions) ----------
let target = null;
let cap = 12;
let streak = 0;
function biggestTotal() {
  let m = 0;
  for (const b of blocks.values()) m = Math.max(m, totalOf(b));
  return m;
}
function updateChallengeInfo() {
  if (celebrating || target === null) return;
  const big = biggestTotal();
  if (big === 0) { challengeSub.textContent = ""; return; }
  let s = "いま いちばん おおきいのは " + big;
  if (big < target) s += " ・ あと " + (target - big);
  challengeSub.textContent = s;
}
function newChallenge() {
  let t;
  do { t = 5 + Math.floor(Math.random() * (cap - 4)); } while (t === target); // 5..cap
  target = t;
  challengeText.textContent = target + "を つくって！";
  const size = blockSize(target, 20, 3);
  ghostEl.style.gridTemplateColumns = "repeat(" + size.cols + ", 20px)";
  ghostEl.innerHTML = "";
  for (let i = 0; i < target; i++) {
    const c = document.createElement("div");
    c.className = "gcell";
    ghostEl.appendChild(c);
  }
  doneMsg.style.display = "none";
  reviewEl.style.display = "none";
  challengeInfo.style.display = "block";
  ghostEl.style.display = "grid";
  updateChallengeInfo();
}
let celebrating = false;
function checkChallenge() {
  if (celebrating || target === null) return;
  for (const b of blocks.values()) {
    if (totalOf(b) === target) { celebrate(b); return; }
  }
}
function celebrate(winBlock) {
  celebrating = true;
  streak++;
  if (streak % 3 === 0 && cap < 30) cap += 3;
  sndDone();
  doneMsg.style.display = "block";
  challengeInfo.style.display = "none";
  ghostEl.style.display = "none";
  const marks = ["⭐", "🎈", "✨", "🌟", "🎉"];
  for (let i = 0; i < 14; i++) {
    const s = document.createElement("div");
    s.className = "star";
    s.textContent = marks[i % marks.length];
    s.style.left = (8 + Math.random() * 84) + "%";
    s.style.top = (55 + Math.random() * 30) + "%";
    s.style.animationDelay = (Math.random() * 0.4) + "s";
    stage.appendChild(s);
    setTimeout(() => s.remove(), 2400);
  }
  setTimeout(() => showReview(winBlock), 1900);
}

// recipe cell size: about 28px, shrunk only when the parts cannot fit
function recipeCell(parts) {
  const avail = Math.max(200, challengeBar.clientWidth - 430);
  let colsSum = 0, gapSum = 0;
  for (const p of parts) {
    const c = colsFor(totalOf(p));
    colsSum += c; gapSum += (c - 1) * 2;
  }
  const cell = Math.floor((avail - gapSum) / Math.max(1, colsSum));
  return Math.max(14, Math.min(28, cell));
}

// show how the winning block was built: "5 + 7 = 12" in block pictures,
// no evaluative words; the next-challenge button appears a few seconds later
function showReview(winBlock) {
  doneMsg.style.display = "none";
  recipeEl.innerHTML = "";
  const parts = winBlock.leaf !== null ? [winBlock] : [winBlock.left, winBlock.right];
  const cell = recipeCell(parts);
  parts.forEach((p, i) => {
    if (i > 0) {
      const op = document.createElement("div");
      op.className = "op"; op.textContent = "＋";
      recipeEl.appendChild(op);
    }
    const mini = buildBlockEl(p, cell, 2);
    mini.className = "mini";
    recipeEl.appendChild(mini);
  });
  const eq = document.createElement("div");
  eq.className = "op"; eq.textContent = "＝";
  recipeEl.appendChild(eq);
  const res = document.createElement("div");
  res.className = "result"; res.textContent = totalOf(winBlock);
  recipeEl.appendChild(res);
  nextBtn.style.display = "none";
  reviewEl.style.display = "flex";
  setTimeout(() => { nextBtn.style.display = "inline-block"; }, 2500);
}
nextBtn.addEventListener("click", () => {
  ensureAudio();
  reviewEl.style.display = "none";
  celebrating = false;
  sndPop();
  newChallenge();
});

// ---------- top bar buttons ----------
document.getElementById("clearbtn").addEventListener("click", () => {
  ensureAudio();
  if (blocks.size === 0) return;
  snapshot();
  for (const b of Array.from(blocks.values())) removeBlock(b);
  sndSplit();
  updateChallengeInfo();
});
document.getElementById("mutebtn").addEventListener("click", (ev) => {
  ensureAudio();
  muted = !muted;
  ev.currentTarget.textContent = muted ? "🔇" : "🔊";
});

// keep the stage free of scroll/zoom gestures
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());

syncUndoBtn();
newChallenge();
</script>
</body>
